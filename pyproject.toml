[project]
name = "amp-discovery"
version = "0.1.0"
description = "Antimicrobial peptide discovery via protein LM fine-tuning and RLVR."
requires-python = ">=3.11,<3.13"
dependencies = ["pyyaml>=6.0.2","rich>=13.9.4","pandas>=2.0","scikit-learn>=1.4"]

[project.optional-dependencies]
dev = ["pytest>=8.3.4","ruff>=0.8.4"]
train = ["torch>=2.8.0","transformers>=4.57.0","datasets>=4.4.0","peft>=0.18.0","bitsandbytes>=0.49.0","trl>=1.5.1","accelerate>=1.12.0","biopython>=1.84"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amp_discovery"]
