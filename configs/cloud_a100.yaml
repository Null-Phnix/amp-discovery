# RunPod A100 80GB — full ESCAPE training
model_name: "facebook/esm2_t33_650M_UR50D"
use_lora: true
lora_r: 16
training_args:
  output_dir: outputs/cloud_a100
  per_device_train_batch_size: 64
  per_device_eval_batch_size: 128
  num_train_epochs: 10
  logging_steps: 50
  eval_strategy: steps
  eval_steps: 200
  save_strategy: steps
  save_steps: 200
  load_best_model_at_end: true
  metric_for_best_model: eval_f1_micro
  fp16: true
  learning_rate: 2e-4
  warmup_steps: 100
  dataloader_num_workers: 4

# Eval after training:
# python -m amp_discovery.eval configs/eval_cloud_a100.yaml
