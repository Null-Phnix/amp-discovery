# Local RTX 4060 smoke test — 8 GB VRAM
model_name: "facebook/esm2_t6_8M_UR50D"
use_lora: true
lora_r: 8
training_args:
  output_dir: outputs/local_4060_smoke
  per_device_train_batch_size: 16
  per_device_eval_batch_size: 32
  num_train_epochs: 3
  logging_steps: 10
  eval_strategy: steps
  eval_steps: 50
  save_strategy: steps
  save_steps: 50
  load_best_model_at_end: true
  metric_for_best_model: eval_f1_micro
  fp16: true
  dataloader_num_workers: 2
